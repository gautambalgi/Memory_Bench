[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybench"
version = "0.1.0"
description = "A visible, extensible foundation for long-horizon AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "streamlit>=1.45,<2",
  "pydantic-settings>=2.8,<3",
  "jsonschema>=4.23,<5",
  "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
memorybench = "memorybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
