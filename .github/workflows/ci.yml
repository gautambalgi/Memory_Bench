name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t memorybench:test .
      - run: docker run -d --name memorybench -p 8501:8501 memorybench:test
      - name: Check container health
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs memorybench
          exit 1
